[project]
name = "adk-rag-agent"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-cloud-aiplatform==1.92.0",
    "google-cloud-storage==2.19.0",
    "google-genai==1.14.0",
    "gitpython==3.1.40",
    "google-adk==0.5.0",
    "litellm>=1.63.11,<2.0",
    "python-dotenv>=1.0.0",
    "deprecated>=1.2.18",
    "chromadb>=0.5.0",
    "pypdf>=4.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "codespell>=2.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "live: live LLM + KB evals (set RUN_LIVE_EVALS=1)",
]
