request_types:
  faq:
    label: Known question or FAQ
    required_fields: []
    optional_fields: [system, summary]
    always_create_ticket: false
    auto_answer_allowed: true
    follow_up_questions: {}

  known_issue:
    label: Known issue with existing solution
    required_fields: [system, environment, identifier, actual_behavior]
    optional_fields: [error_message, steps_to_reproduce]
    always_create_ticket: false
    auto_answer_allowed: true
    follow_up_questions:
      system: "Which product or system is affected?"
      environment: "Which environment — LIVE (production) or TEST (staging)?"
      identifier: "What is the invoice, order, or document number?"
      actual_behavior: "What is happening when you encounter this issue?"

  technical_incident:
    label: New incident or technical problem
    required_fields: [system, environment, actual_behavior, business_impact]
    optional_fields: [error_message, steps_to_reproduce, affected_users, workaround, expected_behavior]
    always_create_ticket: false
    auto_answer_allowed: false
    follow_up_questions:
      system: "Which product or system is affected?"
      environment: "Which environment is affected (Production, Staging, Dev)?"
      actual_behavior: "What is actually happening?"
      expected_behavior: "What did you expect to happen?"
      error_message: "What error message do you see?"
      steps_to_reproduce: "What steps reproduce the problem?"
      affected_users: "Does this affect one user or multiple users?"
      workaround: "Is there a workaround available?"
      business_impact: "What is the business impact of this issue?"

  feature_request:
    label: Feature request
    required_fields: [system, desired_outcome, current_process, business_value]
    optional_fields: [target_date, affected_users]
    always_create_ticket: true
    auto_answer_allowed: false
    follow_up_questions:
      system: "Which product or system does this relate to?"
      desired_outcome: "What outcome are you trying to achieve?"
      current_process: "How does the current process work?"
      business_value: "Who would benefit from this change and why?"
      target_date: "Is there a target date or deadline?"
      affected_users: "How many users would benefit?"

  access_request:
    label: Access or permissions request
    required_fields: [system, required_role, request_reason]
    optional_fields: [approver]
    always_create_ticket: true
    auto_answer_allowed: false
    follow_up_questions:
      system: "Which system do you need access to?"
      required_role: "Which role or permission level is required?"
      request_reason: "Is this a new access request or a permissions issue?"
      approver: "Who should approve this request?"

  unclear:
    label: Unknown bug or unclear technical issue
    required_fields: [system, summary, actual_behavior]
    optional_fields: [environment, error_message, steps_to_reproduce, business_impact]
    always_create_ticket: true
    auto_answer_allowed: false
    follow_up_questions:
      summary: "Could you describe the problem in more detail?"
      system: "Which product or system does this relate to?"
      actual_behavior: "What is happening?"
      environment: "Which environment is affected?"
      error_message: "What error message do you see, if any?"
      business_impact: "What is the business impact?"

  unsupported:
    label: Unsupported request requiring human assistance
    required_fields: [summary]
    optional_fields: [system, business_impact]
    always_create_ticket: true
    auto_answer_allowed: false
    follow_up_questions:
      summary: "Please describe what you need help with."
      system: "Which product or system is involved?"
      business_impact: "What is the business impact?"

global:
  max_follow_up_questions: 3
  knowledge_confidence_threshold: 0.72
  knowledge_min_results: 1
  batch_fields_intro: >
    Please provide **all** of the following in one message (or use the
    quick-select buttons below):
  batch_fields_footer: >
    You can answer everything at once — for example: "System: Billing,
    Environment: LIVE, Invoice: INV-4001".
  opening_message: >
    Hello! I'm the Support Intake Assistant. I route every request through
    one of three flows: **new feature** (user story), **known bug** (KB
    resolution steps, then bug if needed), or **unknown bug** (bug ticket with
    full context). Describe your issue in text, voice, or attachments—or
    combine them. How can I help you today?

flows:
  flow_1:
    label: "Flow 1 — New feature request"
    summary: >
      Identifies a new requirement and creates a Jira user story with full
      detail and a rough time estimate.
    try_kb: false
    issue_type: Story
    default_estimate: "16h (rough)"
  flow_2:
    label: "Flow 2 — Known bug"
    summary: >
      Recognizes a documented issue, shows step-by-step resolution from the
      knowledge base; closes if fixed or opens a bug ticket if not.
    try_kb: true
    issue_type: Bug
    default_estimate: "4h (rough)"
  flow_3:
    label: "Flow 3 — Unknown bug"
    summary: >
      Creates a Jira bug ticket with all gathered context and a rough time
      estimate when no known fix applies.
    try_kb: false
    issue_type: Bug
    default_estimate: "8h (rough)"

jira:
  project_key_env: JIRA_PROJECT_KEY
  defaults:
    faq:
      issue_type: Task
    known_issue:
      issue_type: Bug
    technical_incident:
      issue_type: Bug
    feature_request:
      issue_type: Story
    access_request:
      issue_type: Task
    unclear:
      issue_type: Bug
    unsupported:
      issue_type: Bug
  labels:
    - support-intake
  time_estimate_field: description
